[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-log-analyzer"
version = "0.1.0"
description = "Summarize common levels and recurring messages in log files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["log_analyzer*"]
